# Overlay: ClickHouse MCP server over HTTP, so LibreChat's native agents can
# query ClickHouse via MCP tools. Connects as the SAME read-only user.
# Enable: docker compose -f docker-compose.yml -f docker-compose.mcp.yml up -d
# NOTE: mcp-clickhouse transport env-var names shift between releases; if tools
# don't load in LibreChat, check the pinned version's README.
services:
  clickhouse-mcp:
    image: python:3.12-slim
    container_name: tcga-clickhouse-mcp
    depends_on:
      clickhouse: {condition: service_healthy}
    command: >
      bash -c "pip install --no-cache-dir mcp-clickhouse==0.1.11 && mcp-clickhouse"
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_USER: agent_ro
      CLICKHOUSE_PASSWORD: ${AGENT_RO_PASSWORD}
      CLICKHOUSE_SECURE: "false"
      CLICKHOUSE_MCP_SERVER_TRANSPORT: "http"
      CLICKHOUSE_MCP_BIND_HOST: "0.0.0.0"
      CLICKHOUSE_MCP_BIND_PORT: "8001"
    ports: ["8001:8001"]
    restart: unless-stopped
